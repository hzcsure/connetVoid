plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.voiceinput'
    compileSdk 34

    defaultConfig {
        applicationId "com.local.voiceinput"
        minSdk 23
        targetSdk 28
        versionCode 9
        versionName "1.8"
        ndk {
            abiFilters 'armeabi-v7a'
        }
        // 在线识别的 Key 默认留空，运行期从 /sdcard/voice/asr.key 读取；
        // 本地调试可用 -PASR_KEY=sk-xxx 直接编进包（不要提交到仓库）。
        buildConfigField "String", "ASR_KEY", "\"${project.findProperty('ASR_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
