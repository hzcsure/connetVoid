name: v2ctl

on:
  workflow_dispatch:
  push:
    paths:
      - 'v2ctl/**'
      - '.github/workflows/v2ctl.yml'

jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          AJAR=$(ls "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          echo "android.jar=$AJAR"
          mkdir -p build/classes
          javac -source 8 -target 8 -nowarn -encoding UTF-8 \
                -classpath "$AJAR" -d build/classes v2ctl/V2Ctl.java
          find build/classes -name '*.class'

      - name: Dex
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AJAR=$(ls "$SDK"/platforms/android-*/android.jar | sort -V | tail -1)
          D8=$(ls "$SDK"/build-tools/*/d8 | sort -V | tail -1)
          echo "d8=$D8"
          mkdir -p build/dex
          "$D8" --min-api 26 --lib "$AJAR" --output build/dex \
                $(find build/classes -name '*.class')
          ls -l build/dex

      - uses: actions/upload-artifact@v4
        with:
          name: v2ctl-dex
          path: build/dex/classes.dex
